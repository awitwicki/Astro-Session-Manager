<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1117" />
  <title>AstroWeather</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="styles.css" />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
</head>
<body>
  <header>
    <h1>AstroWeather</h1>
  </header>
  <main>
    <div id="location-bar"></div>
    <div class="tabs">
      <button class="tab active" data-tab="tab-weather">Weather</button>
      <button class="tab" data-tab="tab-daylight">Day/Night duration</button>
    </div>
    <div id="tab-weather" class="tab-panel">
      <div id="forecast-root"></div>
    </div>
    <div id="tab-daylight" class="tab-panel hidden">
      <div id="daylight-root"></div>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
